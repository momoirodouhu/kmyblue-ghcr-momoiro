name: Build kmyblue Release Images

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'ビルドする本家 kmyblue のタグ名 (例: kb24.1-lts)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: kmycode/mastodon
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream repository at target tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.tag_name }}

      - name: Extract main Docker metadata
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=raw,value=latest
            type=match,pattern=kb(\d+\.\d+),group=1,value=${{ inputs.tag_name }},prefix=kb

      - name: Extract streaming Docker metadata
        id: meta-streaming
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=raw,value=latest
            type=match,pattern=kb(\d+\.\d+),group=1,value=${{ inputs.tag_name }},prefix=kb

      # 3. GHCR へのログイン
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker Buildx (マルチアーキテクチャビルド) のセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. メインアプリケーションイメージのビルド＆プッシュ
      - name: Build and push main Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. ストリーミングイメージのビルド＆プッシュ
      - name: Build and push streaming Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./streaming/Dockerfile
          push: true
          tags: ${{ steps.meta-streaming.outputs.tags }}
          labels: ${{ steps.meta-streaming.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
