name: Build kmyblue Release Images

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'ビルドする本家 kmyblue のタグ名 (例: kb24.1-lts)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: kmycode/mastodon
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-latest:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check-latest.outputs.is_latest }}
    steps:
      - name: Check if target tag is the latest version
        id: check-latest
        run: |
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases?per_page=20" \
            | jq -r '[.[] | select(.draft == false and .prerelease == false) | .tag_name]
              | map({
                  tag: .,
                  ver: (capture("kb(?<maj>[0-9]+)\\.(?<min>[0-9]+)(?:\\.(?<pat>[0-9]+))?") // {maj:"0", min:"0", pat:"0"})
                })
              | sort_by([((.ver.maj // "0") | tonumber), ((.ver.min // "0") | tonumber), ((.ver.pat // "0") | tonumber)])
              | last.tag')
          echo "Detected latest upstream tag: ${LATEST_TAG}"
          if [ "${{ inputs.tag_name }}" = "${LATEST_TAG}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout upstream repository at target tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.tag_name }}

      # GHCR へのログイン
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Buildx のセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # メインアプリケーションイメージのネイティブビルド＆ダイジェストプッシュ
      - name: Build and push main Docker image by digest (${{ matrix.arch }})
        id: build-main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.arch }}

      # ストリーミングイメージのネイティブビルド＆ダイジェストプッシュ
      - name: Build and push streaming Docker image by digest (${{ matrix.arch }})
        id: build-streaming
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./streaming/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=streaming-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=streaming-${{ matrix.arch }}

      - name: Save image digests
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build-main.outputs.digest }}" > "/tmp/digests/main-${{ matrix.arch }}"
          echo -n "${{ steps.build-streaming.outputs.digest }}" > "/tmp/digests/streaming-${{ matrix.arch }}"

      - name: Upload image digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [check-latest, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Extract main Docker metadata
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=raw,value=latest,enable=${{ needs.check-latest.outputs.is_latest }}
            type=match,pattern=kb(\d+\.\d+),group=1,value=${{ inputs.tag_name }},prefix=kb

      - name: Extract streaming Docker metadata
        id: meta-streaming
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=raw,value=latest,enable=${{ needs.check-latest.outputs.is_latest }}
            type=match,pattern=kb(\d+\.\d+),group=1,value=${{ inputs.tag_name }},prefix=kb

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push main multi-arch manifest
        run: |
          TAGS_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS_ARGS+=(-t "$tag")
          done <<< "${{ steps.meta-main.outputs.tags }}"
          docker buildx imagetools create "${TAGS_ARGS[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat /tmp/digests/main-amd64)" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat /tmp/digests/main-arm64)"

      - name: Create and push streaming multi-arch manifest
        run: |
          TAGS_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS_ARGS+=(-t "$tag")
          done <<< "${{ steps.meta-streaming.outputs.tags }}"
          docker buildx imagetools create "${TAGS_ARGS[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming@$(cat /tmp/digests/streaming-amd64)" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming@$(cat /tmp/digests/streaming-arm64)"
