name: Build kmyblue Release Images

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'ビルドする本家 kmyblue のタグ名 (例: kb24.1-lts)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: kmycode/mastodon
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check if target tag is the latest version
        id: check-latest
        run: |
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases?per_page=20" \
            | jq -r '[.[] | select(.draft == false and .prerelease == false) | .tag_name]
              | map({
                  tag: .,
                  ver: (capture("kb(?<maj>[0-9]+)\\.(?<min>[0-9]+)(?:\\.(?<pat>[0-9]+))?") // {maj:"0", min:"0", pat:"0"})
                })
              | sort_by([((.ver.maj // "0") | tonumber), ((.ver.min // "0") | tonumber), ((.ver.pat // "0") | tonumber)])
              | last.tag')
          echo "Detected latest upstream tag: ${LATEST_TAG}"
          if [ "${{ inputs.tag_name }}" = "${LATEST_TAG}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream repository at target tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.tag_name }}

      - name: Extract main Docker metadata
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=raw,value=latest,enable=${{ steps.check-latest.outputs.is_latest }}
            type=match,pattern=kb(\d+\.\d+),group=1,value=${{ inputs.tag_name }},prefix=kb

      - name: Extract streaming Docker metadata
        id: meta-streaming
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag_name }}
            type=raw,value=latest,enable=${{ steps.check-latest.outputs.is_latest }}
            type=match,pattern=kb(\d+\.\d+),group=1,value=${{ inputs.tag_name }},prefix=kb

      # 3. GHCR へのログイン
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker Buildx (マルチアーキテクチャビルド) のセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. メインアプリケーションイメージのビルド＆プッシュ
      - name: Build and push main Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. ストリーミングイメージのビルド＆プッシュ
      - name: Build and push streaming Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./streaming/Dockerfile
          push: true
          tags: ${{ steps.meta-streaming.outputs.tags }}
          labels: ${{ steps.meta-streaming.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
